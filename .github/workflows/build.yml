name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0 (leave empty to only build)"
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -W error -m unittest discover -s tests

  exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --noconsole --uac-admin --name AppRemover run.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: AppRemover-windows
          path: dist/AppRemover.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: exe
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppRemover-windows
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: >
          gh release create "$TAG" AppRemover.exe
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "App Remover $TAG" --generate-notes
