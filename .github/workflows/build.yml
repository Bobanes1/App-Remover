name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.2.0 (leave empty to only build)"
        default: ""

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --component clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib

  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: AppRemover-windows
          path: target/release/AppRemover.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [test-linux, exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AppRemover-windows
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: >
          gh release create "$TAG" AppRemover.exe
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "App Remover $TAG" --generate-notes
